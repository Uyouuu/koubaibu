spring:
  application:
    name: koubaibu
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

# Common configuration
logging:
  level:
    root: INFO
    com.koubaibu: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

vaadin:
  launch-browser: false
  whitelisted-packages: com.koubaibu

# Slack notification settings (common defaults)
slack:
  enabled: false
  channel: "#lab-inventory-alert"
  retry:
    max-attempts: 3
    initial-interval: 1000
    multiplier: 2.0
  duplicate-suppression-minutes: 5

# Alert default threshold
alert:
  default-threshold: 2
