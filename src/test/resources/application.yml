# Test environment configuration
spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      data-locations: # Empty - don't load data.sql for tests
  h2:
    console:
      enabled: false

security:
  mtls:
    enabled: false
  operator-token:
    enabled: false

slack:
  enabled: false

logging:
  level:
    root: WARN
    com.koubaibu: INFO
